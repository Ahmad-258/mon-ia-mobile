name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython Kivy

    - name: Install Android SDK/NDK dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake

    - name: Create buildozer.spec
      run: |
        buildozer init
        sed -i 's/^title = .*/title = IA Ahmad/' buildozer.spec
        sed -i 's/^package.name = .*/package.name = iaahmad/' buildozer.spec
        sed -i 's/^package.domain = .*/package.domain = org.ahmad/' buildozer.spec
        sed -i 's/^requirements = .*/requirements = python3,kivy,huggingface_hub,requests,certifi,charset-normalizer,idna,urllib3/' buildozer.spec
        sed -i 's/# android.permissions = .*/android.permissions = INTERNET/' buildozer.spec
        sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec

    - name: Build Android APK
      run: |
        yes | buildozer android debug
        
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Mon-IA-Ahmad
        path: bin/*.apk
